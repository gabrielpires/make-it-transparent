<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Make It Transparent">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <pattern id="checker" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#ffffff"/>
      <rect width="3" height="3" fill="#d4d4d8"/>
      <rect x="3" y="3" width="3" height="3" fill="#d4d4d8"/>
    </pattern>
    <clipPath id="r">
      <rect x="1" y="1" width="30" height="30" rx="6" ry="6"/>
    </clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="32" height="32" fill="url(#checker)"/>
    <path d="M0 0 H32 L0 32 Z" fill="url(#g)"/>
  </g>
  <rect x="1" y="1" width="30" height="30" rx="6" ry="6"
        fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
</svg>

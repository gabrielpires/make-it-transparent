name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write       # push to ghcr.io/<owner>/<repo>
  id-token: write       # cosign / OIDC for build provenance attestation
  attestations: write   # actions/attest-build-provenance writes here

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false   # don't cancel a publish mid-push

jobs:
  publish:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # branch name → :main on default-branch pushes
            type=ref,event=branch
            # short commit sha → :sha-abc1234
            type=sha,format=short
            # tag pushes → :v1.2.3, :1.2.3, :1.2 (and :latest also via raw rule)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # :latest follows the default branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (linux/amd64 + linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Print the resulting image
        run: |
          echo "Pushed:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  /'
          echo ""
          echo "Pull with:"
          echo "  docker pull ghcr.io/${{ github.repository }}:latest"
          echo ""
          echo "Verify provenance with:"
          echo "  gh attestation verify oci://ghcr.io/${{ github.repository }}:latest --owner ${{ github.repository_owner }}"

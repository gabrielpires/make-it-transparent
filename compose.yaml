# compose.yaml — minimal, hardened self-host config.
# Once the image is published to GHCR (next PR), the `image:` line below
# is what self-hosters will pull. For now you can build locally with
#   docker compose build
# and run with
#   docker compose up -d

services:
  make-it-transparent:
    image: ghcr.io/gabrielpires/make-it-transparent:latest
    build:
      context: .
    container_name: make-it-transparent
    restart: unless-stopped
    ports:
      # Bind to localhost so a reverse proxy (Caddy/nginx/Cloudflare Tunnel)
      # is the only thing facing the internet. Drop the "127.0.0.1:" prefix
      # if you want to expose directly.
      - "127.0.0.1:8080:8080"

    # Hardening: the binary writes nothing to disk other than the multipart
    # spool, which we redirect to a 64 MiB tmpfs.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Resource ceiling. Each decode peaks ~150 MiB at the 16 MP MaxPixels cap;
    # the in-app semaphore caps concurrency at 4 → ~600 MiB worst case. Most
    # uploads (1–4 MP screenshots) stay well under 50 MiB. CPU is cheap —
    # decoding 16 MP takes ~20 ms, encoding is similar.
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

    # A built-in `/healthcheck` HTTP endpoint is exposed by httpkit. The
    # distroless base has no shell or curl/wget, so a Docker-managed
    # healthcheck would need a custom probe binary. Probe externally
    # instead — Caddy, k8s liveness, Uptime-Kuma, etc.
